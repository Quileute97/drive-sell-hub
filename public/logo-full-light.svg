    <circle cx="55" cy="55" r="6" fill="#0F3A7E" />
  </g>

  <!-- Typography -->
  <text x="146" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Outfit', 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    <tspan fill="#0F172A">Sale</tspan>
    <tspan fill="#0284C7">my</tspan>
    <tspan fill="#EA580C">link</tspan>
    <tspan fill="#64748B" font-size="34" font-weight="600">.com</tspan>
