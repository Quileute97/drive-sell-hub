  <text x="149" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#64748B" letter-spacing="3.5">
