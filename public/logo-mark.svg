<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="slBlueTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0F3A7E" />
    </linearGradient>
    <linearGradient id="slOrangeTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="40%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="shadowTrans" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#shadowTrans)">
    <!-- Bottom Orange Link Loop -->
    <path d="M 152 352 C 152 424 360 424 360 352 L 360 292 C 360 216 272 200 200 200" 
          stroke="url(#slOrangeTrans)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Top Blue Link Loop -->
    <path d="M 360 160 C 360 88 152 88 152 160 L 152 220 C 152 296 240 312 312 312" 
          stroke="url(#slBlueTrans)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Center Pulse Glow -->
    <circle cx="256" cy="256" r="28" fill="#FFFFFF" stroke="#0F3A7E" stroke-width="4" />
  </g>
</svg>
